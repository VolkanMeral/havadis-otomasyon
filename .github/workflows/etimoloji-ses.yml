name: Etimoloji seslendirme (paylaşım yapmaz)

on:
  push:
    branches: [etimoloji-ses]
    paths: ["etimoloji/**/anlatim.json", "etimoloji/ses_uret.py", ".github/workflows/etimoloji-ses.yml"]

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: pip install edge-tts
      - name: Seslendir
        run: python etimoloji/ses_uret.py etimoloji/*/anlatim.json
      - name: Kaydet
        if: always()
        run: |
          git config user.name "havadis-bot"
          git config user.email "bot@havadis.at"
          git add etimoloji/*/ses/ etimoloji/ses_gunluk.txt 2>/dev/null; git add etimoloji/*/ses/
          git commit -m "Etimoloji seslendirme parçaları" || exit 0
          git push
