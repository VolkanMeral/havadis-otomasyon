name: Etimoloji görselleri (Wikimedia Commons, paylaşım yapmaz)

on:
  push:
    branches: [etimoloji-ses]
    paths: ["etimoloji/**/gorsel.json", "etimoloji/gorsel_indir.py", ".github/workflows/etimoloji-gorsel.yml"]

permissions:
  contents: write

jobs:
  gorsel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Görselleri indir
        run: python etimoloji/gorsel_indir.py etimoloji/*/gorsel.json
      - name: Kaydet
        if: always()
        run: |
          git config user.name "havadis-bot"; git config user.email "bot@havadis.at"
          git add etimoloji/*/gorsel/
          git commit -m "Etimoloji görselleri" || exit 0
          for i in 1 2 3; do git push && exit 0; git pull --rebase -q; done
