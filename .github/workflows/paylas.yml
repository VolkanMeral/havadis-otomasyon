name: Havadis saatlik paylaşım

on:
  schedule:
    # Saat başları: Avusturya, Vorarlberg, Almanya, İsviçre, Sağlık, Dünya, Teknoloji, Havadis Özel, Avrupa
    # 06:00–20:00 UTC = yaz saatinde 08:00–22:00 Viyana (kışın 07:00–21:00)
    - cron: "0 6-20 * * *"
    # Buçuklar: sadece Vorarlberg (böylece Vorarlberg haberleri yarım saatte bir çıkar)
    - cron: "30 6-20 * * *"
    # 15 geçe: video (Reels). Sadece VIDEO_HOURS saatlerinde paylaşır (varsayılan 07,08,10,11,13,14,16,17,19,20 Viyana; 5-20 UTC yaz/kış saatinde 07:15'i de kapsar)
    - cron: "15 5-20 * * *"
    # Pazar 19:45 Viyana: "Vorarlberg'de bu hafta" karuseli (yaz/kış saati için iki saat; sadece 19:45'te çalışır)
    - cron: "45 17,18 * * 0"
    # Çarşamba 19:45 Viyana: "Bilmeniz gerekenler" rehber karuseli
    - cron: "45 17,18 * * 3"
    # Pazar 11:05 Viyana: "Avusturya'da bu hafta" özet videosu (müzik + yazı; FB/IG Reels + YouTube)
    - cron: "5 9,10 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (1 = paylaşma, sadece görsel üret)"
        default: "1"
      is:
        description: "Ne yapılsın? normal / haftalik / rehber / ozet (haftalık özet videosu)"
        default: "normal"
      video:
        description: "1 = bu çalışmada akışa video paylaş (Story de üretilir)"
        default: "0"
      sadece_kontrol:
        description: "1 = sadece anahtarı kontrol et (paylaşım yok)"
        default: "0"
      link:
        description: "Öne alınıp hemen paylaşılacak haberin adresi (boş = normal sıra)"
        default: ""
      foto:
        description: "Link ile birlikte: depodaki özel fotoğrafın yolu (ör. ozel_foto/x.jpg)"
        default: ""
      vurgu:
        description: "Link ile birlikte: başlıkta kırmızı banda alınacak kelimeler"
        default: ""
      tam_metin:
        description: "Link ile birlikte: 1 = Instagram'da haberin tam metni"
        default: "0"
      tiktok_kod:
        description: "TikTok'u bağlamak için: izin verdikten sonra açılan havadis.at adresinin TAMAMI (bir kez)"
        default: ""

permissions:
  contents: write

concurrency:
  group: havadis-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'inbox' }}
      TIKTOK_HOURS: ${{ vars.TIKTOK_HOURS || '8,11,14,17,20' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SKIP_CATEGORIES: ${{ vars.SKIP_CATEGORIES || 'TAZİYE' }}
      TEMPLATE: ${{ vars.TEMPLATE || 'manset' }}
      AI_LABEL: ${{ vars.AI_LABEL || 'KI-unterstützt' }}
      SCHEDULE: ${{ github.event.schedule }}
      JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.is || 'normal' }}
      FORCE_VIDEO: ${{ github.event_name == 'workflow_dispatch' && inputs.video || '0' }}
      FORCE_LINK: ${{ github.event_name == 'workflow_dispatch' && inputs.link || '' }}
      FORCE_PHOTO: ${{ github.event_name == 'workflow_dispatch' && inputs.foto || '' }}
      FORCE_VURGU: ${{ github.event_name == 'workflow_dispatch' && inputs.vurgu || '' }}
      FULL_TEXT: ${{ github.event_name == 'workflow_dispatch' && inputs.tam_metin || '0' }}
      VIDEO_HOURS: ${{ vars.VIDEO_HOURS || '7,8,10,11,13,14,16,17,19,20' }}
      STORY_CATEGORIES: ${{ vars.STORY_CATEGORIES || 'Avusturya,Vorarlberg' }}
      INCLUDE_CATEGORIES: ${{ vars.INCLUDE_CATEGORIES || 'Avusturya,Vorarlberg,Almanya,İsviçre,Sağlık,Dünya,Teknoloji,Havadis Özel,Avrupa' }}
      HALF_HOUR_CATEGORIES: ${{ vars.HALF_HOUR_CATEGORIES || 'Vorarlberg' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: TikTok'u bağla (bir kez)
        if: github.event_name == 'workflow_dispatch' && inputs.tiktok_kod != ''
        env:
          TIKTOK_KOD: ${{ inputs.tiktok_kod }}
        run: |
          echo "::add-mask::$TIKTOK_KOD"
          python tiktok.py baglan "$TIKTOK_KOD"

      - name: TikTok kontrolü
        if: github.event_name == 'workflow_dispatch' && inputs.sadece_kontrol == '1' && env.TIKTOK_CLIENT_KEY != ''
        run: python tiktok.py kontrol

      - name: YouTube kontrolü
        if: github.event_name == 'workflow_dispatch' && inputs.sadece_kontrol == '1'
        run: python youtube.py kontrol

      - name: Sadece bağlantı kontrolü
        if: github.event_name == 'workflow_dispatch' && inputs.sadece_kontrol == '1'
        env:
          CHECK_ONLY: "1"
        run: python havadis_bot.py

      - name: Yeni haber var mı?
        if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.sadece_kontrol == '1' || inputs.tiktok_kod != '')) }}
        id: kontrol
        run: python havadis_bot.py --kontrol

      - name: Tarayıcıyı önbellekten al
        if: steps.kontrol.outputs.yeni == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Tarayıcıyı kur
        if: steps.kontrol.outputs.yeni == 'true'
        run: python -m playwright install chromium && (timeout 240 python -m playwright install-deps chromium || echo "::warning::Sistem paketleri kurulamadı, hazır olanlarla devam")

      - name: Video aracını kur
        if: steps.kontrol.outputs.yeni == 'true'
        run: which ffmpeg || (pip install -q imageio-ffmpeg && sudo ln -sf "$(python -c 'import imageio_ffmpeg as f; print(f.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg && ffmpeg -version | head -1)

      - name: Görseli üret ve paylaş
        if: steps.kontrol.outputs.yeni == 'true'
        run: python havadis_bot.py

      - name: Üretilen görseli sakla
        if: always() && steps.kontrol.outputs.yeni == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paylasim-${{ github.run_number }}
          path: cikti/
          if-no-files-found: ignore

      - name: Önizlemeyi depoya koy (elle, deneme modu + link)
        if: always() && github.event_name == 'workflow_dispatch' && inputs.dry_run == '1' && inputs.link != ''
        run: |
          rm -rf ornek/onizleme && mkdir -p ornek/onizleme
          cp cikti/* ornek/onizleme/ 2>/dev/null || true
          git add -A ornek/onizleme

      - name: Paylaşılan haber listesini kaydet
        if: always()
        run: |
          git config user.name "havadis-bot"
          git config user.email "bot@havadis.at"
          for f in posted.json arsiv.json karusel_durum.json tiktok_token.enc; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "Paylaşılan haberler güncellendi"
          # Depoya aynı anda başka değişiklik geldiyse önce onu al, sonra tekrar dene
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -q || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
