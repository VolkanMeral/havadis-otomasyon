name: Havadis saatlik paylaşım

on:
  schedule:
    # Saat başları: 4 kategori (Avusturya, Vorarlberg, Avrupa, Almanya)
    # 06:00–20:00 UTC = yaz saatinde 08:00–22:00 Viyana (kışın 07:00–21:00)
    - cron: "0 6-20 * * *"
    # Buçuklar: sadece Vorarlberg (böylece Vorarlberg haberleri yarım saatte bir çıkar)
    - cron: "30 6-20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (1 = paylaşma, sadece görsel üret)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: havadis-paylasim
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SKIP_CATEGORIES: ${{ vars.SKIP_CATEGORIES || 'TAZİYE' }}
      TEMPLATE: ${{ vars.TEMPLATE || 'kart' }}
      INCLUDE_CATEGORIES: ${{ github.event.schedule == '30 6-20 * * *' && (vars.HALF_HOUR_CATEGORIES || 'Vorarlberg') || (vars.INCLUDE_CATEGORIES || 'Avusturya,Vorarlberg,Avrupa,Almanya') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Yeni haber var mı?
        id: kontrol
        run: python havadis_bot.py --kontrol

      - name: Tarayıcıyı önbellekten al
        if: steps.kontrol.outputs.yeni == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Tarayıcıyı kur
        if: steps.kontrol.outputs.yeni == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Görseli üret ve paylaş
        if: steps.kontrol.outputs.yeni == 'true'
        run: python havadis_bot.py

      - name: Üretilen görseli sakla
        if: always() && steps.kontrol.outputs.yeni == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: paylasim-${{ github.run_number }}
          path: cikti/
          if-no-files-found: ignore

      - name: Paylaşılan haber listesini kaydet
        if: always()
        run: |
          git config user.name "havadis-bot"
          git config user.email "bot@havadis.at"
          git add posted.json || true
          git diff --cached --quiet || (git commit -m "Paylaşılan haberler güncellendi" && git push)
