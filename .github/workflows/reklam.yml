name: Havadis reklam paylaşımı

on:
  schedule:
    # Her saat 25 geçe (Viyana 07:25–22:25 yaz / 06:25–21:25 kış): sonraki 35 dk içinde reklam varsa
    # reklam.py tam saatini bekleyip paylaşır. Yoksa tarayıcı kurulmadan hemen biter.
    - cron: "25 5-20 * * *"
  push:
    branches: [main]
    paths:
      - "reklam/reklamlar.json"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Deneme modu (1 = paylaşma, sadece görsel/video üret)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: havadis-reklam
  cancel-in-progress: false

jobs:
  reklam:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      RUN_SLOT: reklam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Son reklam durumunu al
        # Sırada bekleyen bir çalışma eski kopyayla başlamasın (aynı reklam iki kez paylaşılmasın)
        run: git fetch -q origin main && git reset -q --hard origin/main

      - name: Gereksinimleri kur
        run: pip install -r requirements.txt

      - name: Sırası gelen reklam var mı?
        id: kontrol
        run: python reklam.py --kontrol

      - name: Tarayıcıyı önbellekten al
        if: steps.kontrol.outputs.var == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Tarayıcıyı kur
        if: steps.kontrol.outputs.var == 'true'
        run: python -m playwright install chromium && (timeout 240 python -m playwright install-deps chromium || echo "::warning::Sistem paketleri kurulamadı, hazır olanlarla devam")

      - name: Video aracını kur
        if: steps.kontrol.outputs.var == 'true'
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Sırası gelen reklamları paylaş
        if: steps.kontrol.outputs.var == 'true'
        run: python reklam.py

      - name: Üretilenleri sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reklam-${{ github.run_number }}
          path: cikti/reklam/
          if-no-files-found: ignore

      - name: Reklam durumunu kaydet
        if: always()
        run: |
          git config user.name "havadis-bot"
          git config user.email "bot@havadis.at"
          [ -f reklam/reklam_durum.json ] && git add reklam/reklam_durum.json
          git diff --cached --quiet && exit 0
          git commit -m "Reklam durumu güncellendi"
          for i in 1 2 3 4 5; do
            git push && exit 0
            git pull --rebase -q || { git rebase --abort; exit 1; }
            sleep 3
          done
          exit 1
